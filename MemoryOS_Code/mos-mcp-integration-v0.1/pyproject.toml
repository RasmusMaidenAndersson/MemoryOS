[project]
name = "mos-mcp-integration"
version = "0.1.0"
description = "MOS Model Context Protocol integration layer"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2"]

[project.scripts]
mos-mcp = "mos_mcp.cli:main"
